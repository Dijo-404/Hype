# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:



################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1, 2880x1800@120, 0x0, 2.0, bitdepth,10


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun
$browser = firefox
$editor = kitty -e nvim
$sysmonitor = kitty -e htop


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = swww-daemon && sleep 0.1 && swww img /home/dj/Pictures/Wallpapers/aurora_borealis.png --transition-type none --transition-step 255 --transition-fps 120
exec-once = $terminal
exec-once = nm-applet &
exec-once = waybar &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store   # Clipboard manager
exec-once = wl-paste --type image --watch cliphist store  # Clipboard manager for images


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons




#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 1

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(7fbbb3)
    col.inactive_border = rgb(e67e80)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 4
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.90
    inactive_opacity = 0.80

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.2
        new_optimizations = true
        xray = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = true

    # Clean bezier curves for 120Hz
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = easeIn, 0.5, 0, 0.75, 0
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    # Window animations (~150-200ms, snappy)
    animation = windows, 1, 2, snappy, slide
    animation = windowsIn, 1, 2, snappy, slide
    animation = windowsOut, 1, 2, snappy, slide
    animation = windowsMove, 1, 2, snappy

    # Fade animations (quick)
    animation = fade, 1, 2, snappy
    animation = fadeIn, 1, 2, snappy
    animation = fadeOut, 1, 2, snappy

    # Border
    animation = border, 1, 2, snappy

    # Workspace animations (smooth slide)
    animation = workspaces, 1, 2, snappy, slide
    animation = specialWorkspace, 1, 2, snappy, slidevert

    # Layer animations
    animation = layers, 1, 2, snappy
    animation = layersIn, 1, 2, snappy
    animation = layersOut, 1, 2, snappy
}


# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace




###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# ==========================================
# WINDOW MANAGEMENT
# ==========================================
bind = $mainMod, Q, killactive,
bind = CTRL, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, Delete, exit,
bind = $mainMod, W, togglefloating,
bind = $mainMod, G, togglegroup,
bind = SHIFT, F11, fullscreen,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, F, pin,
bind = ALT CTRL, Delete, exec, wlogout
bind = ALT, Control_R, exec, pkill waybar || waybar
bind = $mainMod, J, togglesplit,

# ==========================================
# GROUP NAVIGATION
# ==========================================
bind = $mainMod CTRL, H, changegroupactive, b
bind = $mainMod CTRL, L, changegroupactive, f

# ==========================================
# CHANGE FOCUS
# ==========================================
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = ALT, Tab, cyclenext,

# ==========================================
# RESIZE ACTIVE WINDOW
# ==========================================
binde = $mainMod SHIFT, right, resizeactive, 30 0
binde = $mainMod SHIFT, left, resizeactive, -30 0
binde = $mainMod SHIFT, up, resizeactive, 0 -30
binde = $mainMod SHIFT, down, resizeactive, 0 30

# ==========================================
# MOVE & RESIZE WITH MOUSE
# ==========================================
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# ==========================================
# MOVE ACTIVE WINDOW
# ==========================================
bind = $mainMod CTRL SHIFT, left, movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up, movewindow, u
bind = $mainMod CTRL SHIFT, down, movewindow, d

# ==========================================
# APPLICATIONS
# ==========================================
bind = $mainMod, T, exec, $terminal
bind = $mainMod ALT, T, exec, $terminal --class dropdown
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, $editor
bind = $mainMod, B, exec, $browser
bind = CTRL SHIFT, Escape, exec, $sysmonitor

# ==========================================
# ROFI MENUS
# ==========================================
bind = $mainMod, A, exec, rofi -show drun
bind = $mainMod, Tab, exec, rofi -show window
bind = $mainMod SHIFT, E, exec, rofi -show filebrowser
bind = $mainMod, slash, exec, rofi -show keys
bind = $mainMod, comma, exec, rofi -modi emoji -show emoji
bind = $mainMod, period, exec, rofi -modi emoji -show emoji
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, A, exec, rofi -show combi

# ==========================================
# AUDIO
# ==========================================
bindel = , F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , F12, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+

# ==========================================
# MEDIA
# ==========================================
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ==========================================
# BRIGHTNESS
# ==========================================
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 1%-
bindel = , F6, exec, brightnessctl set 5%+
bindel = , F5, exec, brightnessctl set 5%-

# ==========================================
# MISC
# ==========================================
bind = $mainMod, K, exec, hyprctl switchxkblayout all next
bind = $mainMod ALT, G, exec, hyprctl --batch "keyword animations:enabled 0; keyword decoration:blur:enabled 0; keyword general:gaps_in 0; keyword general:gaps_out 0; keyword general:border_size 1"

# ==========================================
# SCREEN CAPTURE
# ==========================================
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod, P, exec, grimblast copy area
bind = $mainMod CTRL, P, exec, grimblast --freeze copy area
bind = $mainMod ALT, P, exec, grimblast copy output
bind = , Print, exec, grimblast copy screen

# ==========================================
# WALLPAPER (requires swww)
# ==========================================
bind = $mainMod ALT, right, exec, swww img $(find ~/Pictures/Wallpapers -type f | shuf -n1)
bind = $mainMod ALT, left, exec, swww img $(find ~/Pictures/Wallpapers -type f | shuf -n1)
bind = $mainMod SHIFT, W, exec, find ~/Pictures/Wallpapers -type f | rofi -dmenu | xargs swww img

# ==========================================
# WAYBAR LAYOUT
# ==========================================
bind = $mainMod ALT, up, exec, pkill waybar; waybar &
bind = $mainMod ALT, down, exec, pkill waybar; waybar &

# ==========================================
# WORKSPACE NAVIGATION
# ==========================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, down, workspace, empty
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ==========================================
# RELATIVE WORKSPACE
# ==========================================
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod CTRL, left, workspace, e-1

# ==========================================
# SPECIAL WORKSPACE (SCRATCHPAD)
# ==========================================
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod ALT, S, movetoworkspacesilent, special:magic

# ==========================================
# MOVE WINDOW SILENTLY
# ==========================================
bind = $mainMod ALT, 1, movetoworkspacesilent, 1
bind = $mainMod ALT, 2, movetoworkspacesilent, 2
bind = $mainMod ALT, 3, movetoworkspacesilent, 3
bind = $mainMod ALT, 4, movetoworkspacesilent, 4
bind = $mainMod ALT, 5, movetoworkspacesilent, 5
bind = $mainMod ALT, 6, movetoworkspacesilent, 6
bind = $mainMod ALT, 7, movetoworkspacesilent, 7
bind = $mainMod ALT, 8, movetoworkspacesilent, 8
bind = $mainMod ALT, 9, movetoworkspacesilent, 9
bind = $mainMod ALT, 0, movetoworkspacesilent, 10

# ==========================================
# MOVE WINDOW TO WORKSPACE
# ==========================================
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod ALT CTRL, right, movetoworkspace, e+1
bind = $mainMod ALT CTRL, left, movetoworkspace, e-1

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
xwayland {
    force_zero_scaling = true
}

# Theme Stuffs Dj

env = XDG_SESSION_TYPE,wayland
