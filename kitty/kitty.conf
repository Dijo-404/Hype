# Kitty Configuration

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window Appearance
remember_window_size  yes
initial_window_width  640
initial_window_height 400
window_padding_width  8
window_padding_height 8

# Rounded Corners (requires compositor support)
# Hyprland will handle this via windowrule
hide_window_decorations yes

# ============ Everforest Color Scheme ============
# Matching Waybar colors exactly

# Background and Foreground
background #2d353b
foreground #d3c6aa

# Cursor
cursor #d3c6aa
cursor_text_color #2d353b

# Selection
selection_foreground #2d353b
selection_background #7fbbb3

# Transparency
background_opacity 0.85
dynamic_background_opacity yes

# Normal Colors
color0  #343f44
color1  #e67e80
color2  #a7c080
color3  #dbbc7f
color4  #7fbbb3
color5  #d699b6
color6  #83c092
color7  #d3c6aa

# Bright Colors
color8  #475258
color9  #e67e80
color10 #a7c080
color11 #dbbc7f
color12 #7fbbb3
color13 #d699b6
color14 #83c092
color15 #d3c6aa

# Extended Colors
color16 #e69875
color17 #e67e80

# Tab Bar Colors
active_tab_foreground   #2d353b
active_tab_background   #a7c080
inactive_tab_foreground #d3c6aa
inactive_tab_background #343f44

# Performance Optimizations
update_check_interval 0
shell_integration enabled
